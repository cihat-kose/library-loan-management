[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "library-loan-management"
version = "0.1.0"
description = "A self-contained SQLite command-line application for managing library loans"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.urls]
Homepage = "https://github.com/cihat-kose/library-loan-management"
Repository = "https://github.com/cihat-kose/library-loan-management"
Issues = "https://github.com/cihat-kose/library-loan-management/issues"

[project.scripts]
library-loans = "library_loans.cli:main"

[tool.setuptools.packages.find]
include = ["library_loans*"]
